services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mchttasarim
      POSTGRES_PASSWORD: mchttasarim
      POSTGRES_DB: mchttasarim
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mchttasarim"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Bu dosya sunucu (üretim) dağıtımı içindir: .env kopyası ENV=development bırakılsa bile API üretim modunda çalışır
      # (çerez Secure, /api/health env=production). HTTP üzerinden yerel Docker denemesi için .env'e COOKIE_SECURE=false ekleyin.
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    restart: unless-stopped
    # Chromium /dev/shm kullanır; Docker varsayılanı (64MB) ağır sayfalarda tarayıcıyı çökertebilir.
    shm_size: "1gb"
    env_file:
      - ../.env
    environment:
      ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* build-time'dır: runtime `environment:` ile verilemez (paket zaten derlenmiştir), bu yüzden build arg.
      # Varsayılan: tarayıcı aynı kökene `/api/...` ile gider (Nginx → api:8000); ayrı API alan adı gerekirse burada verilir.
      args:
        NEXT_PUBLIC_API_BASE_URL: ""
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
